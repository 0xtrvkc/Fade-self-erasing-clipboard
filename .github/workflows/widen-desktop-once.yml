name: Widen desktop layout once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/widen-desktop-once.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Widen desktop cards and composer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = "/* Desktop: expand clipboard UI to the available window width */"

          if marker in text:
              print("Desktop width patch already present; nothing to do.")
              raise SystemExit(0)

          needle = "  @media (prefers-reduced-motion: reduce){"
          if needle not in text:
              raise SystemExit("Could not find expected CSS insertion point.")

          desktop_css = '''  /* Desktop: expand clipboard UI to the available window width */
          @media (min-width: 768px){
            #feed{
              padding-left:clamp(24px, 4vw, 64px);
              padding-right:clamp(24px, 4vw, 64px);
            }
            .slip{
              width:100%;
              max-width:none;
              padding:16px 20px 18px;
            }
            .content{
              max-height:180px;
            }
            footer{
              padding-left:clamp(24px, 4vw, 64px);
              padding-right:clamp(24px, 4vw, 64px);
            }
            .composer{
              width:100%;
              max-width:none;
            }
            #vaultFeed{
              padding-left:clamp(24px, 4vw, 64px);
              padding-right:clamp(24px, 4vw, 64px);
            }
            .vslip{
              width:100%;
              max-width:none;
            }
          }

'''

          path.write_text(text.replace(needle, desktop_css + needle, 1), encoding="utf-8")
          PY

      - name: Commit index.html
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix desktop clipboard width"
          git push
