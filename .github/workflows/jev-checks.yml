name: Jev integration checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate bounded inference and service failures
        run: node --test tests/jev.test.mjs
      - name: Recheck existing application behavior
        run: |
          node --test tests/*.test.cjs
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/jev-browser" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/jev-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Check desktop and mobile app integration in Chromium
        env:
          JEV_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/jev-browser/node_modules/playwright
        run: node tests/jev-browser.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
